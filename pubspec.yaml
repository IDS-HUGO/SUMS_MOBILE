name: sums
description: "Sistema de Captura Operativa SUMS"
publish_to: 'none'

# 🚀 El cambio vital: subimos de +1 a +2 para que Google Play lo acepte
version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # --- UI & State Management ---
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0

  # --- Networking & Background ---
  http: ^1.6.0
  connectivity_plus: ^7.1.1
  workmanager: ^0.9.0+3
  shared_preferences: ^2.5.5
  file_picker: ^9.2.3

  # --- Database (Drift / SQLite) & Paths ---
  # sqlite3_flutter_libs (^0.6.0+eol) fue removido: su propio changelog dice
  # "Not used anymore, update to version 3.x of package:sqlite3 instead".
  # Desde drift 2.32.0, todas las plataformas Flutter/Dart nativas se
  # soportan sin necesidad de ese paquete: drift ya depende de sqlite3 ^3.4.0
  # (que bundlea SQLite vía hooks), y este proyecto ya está en drift ^2.34.0.
  # Ver https://pub.dev/packages/sqlite3_flutter_libs y el changelog de
  # drift 2.32.0.
  drift: ^2.34.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  flutter_jailbreak_detection: ^1.10.0
  get_it: ^9.2.1
  flutter_riverpod: ^2.6.1

  # --- Security ---
  # Hash del password para permitir validar el login offline sin guardar la
  # contraseña en claro (ver token_storage.dart).
  crypto: ^3.0.6
  # Cifrado AES-256-GCM de los campos JSON sensibles de la BD local
  # (ver core/storage/local_db_encryption.dart). Paquete puro Dart
  # (PointyCastle), sin código nativo — no requiere tocar el motor SQLite.
  encrypt: ^5.0.3
  go_router: ^17.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Code Generation ---
  build_runner: ^2.15.0
  drift_dev: ^2.34.1+1

  # --- Asset Tools ---
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: "ic_launcher_imss"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/IMSS_SOLO_LOGO_PADDED.png"
  ios: true
  image_path: "assets/images/IMSS_SOLO_LOGO_PADDED.png"
  web:
    generate: true
    image_path: "assets/images/IMSS_SOLO_LOGO.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/IMSS_SOLO_LOGO.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/IMSS_SOLO_LOGO.png"